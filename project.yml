name: HardSudoku
options:
  bundleIdPrefix: com.jeffreylipson
  deploymentTarget:
    iOS: "17.0"
packages:
  SudokuCore:
    path: SudokuCore
targets:
  HardSudoku:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SudokuCore
        product: SudokuCore
      - package: SudokuCore
        product: SudokuGame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffreylipson.hardsudoku
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        DEVELOPMENT_TEAM: MMLWY4X5FD
        CODE_SIGN_STYLE: Automatic
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hard Sudoku
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [com.jeffreylipson.hardsudoku.refill]
  HardSudokuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: HardSudoku
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: HardSudoku
        TARGETED_DEVICE_FAMILY: "1,2"
