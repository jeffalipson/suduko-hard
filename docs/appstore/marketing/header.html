<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Store header</title>
<!-- App Store product page header: 3840 × 1646 (21:9). Rendered by header.sh.
     Key art stays in the central band (Apple crops the edges per device). -->
<style>
  @font-face { font-family: "Rounded"; src: url("file:///System/Library/Fonts/SFNSRounded.ttf"); font-weight: 100 1000; }
  :root {
    --night: #0A1230; --ink: #13214A; --paper: #F5F7FB; --signal: #3D7BFF; --pencil: #9AA6C8; --muted: #5B6788;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 3840px; height: 1646px; overflow: hidden; background: var(--night); }
  #canvas {
    position: relative; width: 3840px; height: 1646px; overflow: hidden;
    font-family: "Rounded", system-ui, sans-serif; color: var(--paper);
    background:
      radial-gradient(ellipse 1500px 900px at 50% 58%, rgba(61, 123, 255, 0.30), transparent 70%),
      radial-gradient(ellipse 900px 700px at 12% 10%, rgba(120, 90, 255, 0.16), transparent 70%),
      radial-gradient(ellipse 900px 700px at 90% 95%, rgba(61, 123, 255, 0.18), transparent 70%),
      linear-gradient(100deg, #0A1230 0%, #13245F 35%, #0D1940 60%, #182C72 85%, #0A1230 100%);
  }
  /* A faint 9×9 grid texture across the whole canvas. */
  #canvas::before {
    content: ""; position: absolute; inset: 0; opacity: 0.07;
    background-image:
      linear-gradient(to right, var(--paper) 2px, transparent 2px),
      linear-gradient(to bottom, var(--paper) 2px, transparent 2px);
    background-size: 183px 183px;
    background-position: center;
    mask-image: radial-gradient(ellipse 60% 70% at 50% 50%, transparent 35%, black 100%);
  }
  .headline {
    position: absolute; left: 0; right: 0; top: 300px; text-align: center;
    font-size: 138px; font-weight: 860; letter-spacing: -0.02em;
  }
  .headline em { font-style: normal; color: #8FB2FF; }
  .row {
    position: absolute; left: 0; right: 0; top: 600px;
    display: flex; justify-content: center; align-items: flex-start; gap: 130px;
  }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 46px; }
  .tile.mid { margin-top: -30px; }
  .card {
    width: 560px; height: 560px; padding: 34px; border-radius: 52px;
    background: var(--paper);
    box-shadow: 0 60px 120px rgba(2, 5, 20, 0.55), 0 0 0 6px rgba(255, 255, 255, 0.06);
  }
  .mid .card { width: 620px; height: 620px; box-shadow: 0 70px 140px rgba(2, 5, 20, 0.6), 0 0 0 8px rgba(143, 178, 255, 0.35); }
  .card svg { width: 100%; height: 100%; display: block; }
  .label { font-size: 72px; font-weight: 760; color: var(--paper); letter-spacing: -0.01em; }
  .label small { display: block; text-align: center; font-size: 40px; font-weight: 600; color: var(--pencil); margin-top: 8px; }
</style>
</head>
<body>
<div id="canvas">
  <div class="headline">Logic all the way to <em>Nightmare.</em></div>
  <div class="row">
    <div class="tile">
      <div class="card"><svg id="classic" viewBox="0 0 300 300"></svg></div>
      <div class="label">Classic<small>9×9</small></div>
    </div>
    <div class="tile mid">
      <div class="card"><svg id="killer" viewBox="0 0 300 300"></svg></div>
      <div class="label">Killer<small>cage sums</small></div>
    </div>
    <div class="tile">
      <div class="card"><svg id="mathdoku" viewBox="0 0 300 300"></svg></div>
      <div class="label">Mathdoku<small>+ − × ÷</small></div>
    </div>
  </div>
</div>
<script>
  const NS = "http://www.w3.org/2000/svg";
  const ink = "#13214A", signal = "#3D7BFF", pencil = "#7D89AD", hi = "rgba(61,123,255,0.16)";
  const font = "Rounded, system-ui";
  function el(svg, tag, attrs, text) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    svg.appendChild(e);
    return e;
  }
  const U = 100; // cell size in the 300×300 viewBox
  function grid(svg, { thin = true } = {}) {
    for (let i = 1; i < 3; i++) {
      el(svg, "line", { x1: i * U, y1: 0, x2: i * U, y2: 300, stroke: ink, "stroke-opacity": 0.22, "stroke-width": 1.5 });
      el(svg, "line", { x1: 0, y1: i * U, x2: 300, y2: i * U, stroke: ink, "stroke-opacity": 0.22, "stroke-width": 1.5 });
    }
    el(svg, "rect", { x: 1.5, y: 1.5, width: 297, height: 297, rx: 6, fill: "none", stroke: ink, "stroke-width": 3 });
  }
  function digit(svg, r, c, d, { color = ink, weight = 600, low = false } = {}) {
    el(svg, "text", { x: c * U + 50, y: r * U + (low ? 82 : 70), "text-anchor": "middle", "font-family": font, "font-size": 58, "font-weight": weight, fill: color }, d);
  }
  function notes(svg, r, c, ds) {
    for (const d of ds) {
      const i = d - 1, x = c * U + 22 + (i % 3) * 28, y = r * U + 30 + Math.floor(i / 3) * 28;
      el(svg, "text", { x, y, "text-anchor": "middle", "font-family": font, "font-size": 21, "font-weight": 500, fill: pencil }, d);
    }
  }
  function fill(svg, r, c, color) { el(svg, "rect", { x: c * U, y: r * U, width: U, height: U, fill: color }); }

  // Classic: a box mid-solve, a highlighted hidden single.
  {
    const s = document.getElementById("classic");
    fill(s, 1, 1, hi);
    grid(s);
    digit(s, 0, 0, "5"); digit(s, 0, 2, "8"); digit(s, 1, 0, "3"); digit(s, 2, 1, "9"); digit(s, 2, 2, "1");
    digit(s, 1, 1, "7", { color: signal, weight: 700 });
    notes(s, 0, 1, [2, 4, 6]); notes(s, 1, 2, [2, 4, 6]); notes(s, 2, 0, [2, 4, 6]);
  }
  // Killer: dashed cages with sums.
  {
    const s = document.getElementById("killer");
    grid(s);
    const cage = (pts, sum) => {
      el(s, "path", { d: pts, fill: "none", stroke: ink, "stroke-width": 2.6, "stroke-dasharray": "7 6", "stroke-linejoin": "round" });
      return sum;
    };
    const i = 9; // inset
    cage(`M${i} ${i} H${200 - i} V${100 - i} H${100 - i} V${200 - i} H${i} Z`, 0);
    cage(`M${200 + i} ${i} H${300 - i} V${200 - i} H${200 + i} Z`, 0);
    cage(`M${100 + i} ${100 + i} H${200 - i} V${300 - i} H${i} V${200 + i} H${100 + i} Z`, 0);
    cage(`M${200 + i} ${200 + i} H${300 - i} V${300 - i} H${200 + i} Z`, 0);
    const sum = (r, c, t) => el(s, "text", { x: c * U + 14, y: r * U + 30, "font-family": font, "font-size": 24, "font-weight": 800, fill: ink }, t);
    sum(0, 0, "17"); sum(0, 2, "9"); sum(1, 1, "14"); sum(2, 2, "5");
    digit(s, 0, 1, "8"); digit(s, 1, 0, "6"); digit(s, 2, 2, "5", { color: signal, weight: 700 });
    notes(s, 0, 2, [4, 5]); notes(s, 1, 2, [4, 5]);
  }
  // Mathdoku: solid cage walls with arithmetic clues (a corner of a larger grid).
  //   72× = r1c1 r1c2 (9·8)   3− = r1c3 r2c3 (4 found, so 7 above: 1 is out, as the 1 sits elsewhere in the row)
  //   11+ = r2c1 r3c1         2÷ = r2c2 r3c2 (3 or 6)          6× continues below r3c3
  {
    const s = document.getElementById("mathdoku");
    fill(s, 1, 2, hi);
    grid(s);
    const wall = (x1, y1, x2, y2) => el(s, "line", { x1, y1, x2, y2, stroke: ink, "stroke-width": 7, "stroke-linecap": "round" });
    wall(200, 0, 200, 300);            // column 2 | column 3, all the way down
    wall(0, 100, 200, 100);            // under the 72× cage
    wall(100, 100, 100, 300);          // 11+ | 2÷
    wall(200, 200, 300, 200);          // under the 3− cage
    const clue = (r, c, t) => el(s, "text", { x: c * U + 11, y: r * U + 28, "font-family": font, "font-size": 24, "font-weight": 800, fill: ink }, t);
    clue(0, 0, "72×"); clue(0, 2, "3−"); clue(1, 0, "11+"); clue(1, 1, "2÷"); clue(2, 2, "6×");
    digit(s, 0, 0, "9", { low: true }); digit(s, 0, 1, "8"); digit(s, 1, 2, "4", { color: signal, weight: 700 });
    notes(s, 0, 2, [7]); notes(s, 1, 1, [3, 6]); notes(s, 2, 1, [3, 6]);
  }
</script>
</body>
</html>
